<div class="article-preview" *ngIf="loading">
  <div class="article-meta">
    <div class="info">
      <span class="author">Loading articles...</span>
    </div>
  </div>
</div>

<div class="article-preview" *ngFor="let article of list">
  <div class="article-meta">
    <a [routerLink]="['/profile', article.author.username]">
      <img [src]="article.author.image" />
    </a>
    
    <div class="info">
      <a [routerLink]="['/profile', article.author.username]" class="author">
        {{ article.author.username }}
      </a>
      <span class="date">
        {{ article.createdAt | date: 'longDate' }}
      </span>
    </div>
    
    <app-favorite-button
      [article]="article"
      class="pull-xs-right">
    </app-favorite-button>
  </div>

  <a [routerLink]="['/article', article.slug]" class="preview-link">
    <h1>{{ article.title }}</h1>
    <p>{{ article.description }}</p>
    <span>Read more...</span>
    <ul class="tag-list">
      <li class="tag-default tag-pill tag-outline" *ngFor="let tag of article.tagList">
        {{ tag }}
      </li>
    </ul>
  </a>
</div>

<div class="article-preview" *ngIf="!loading && list.length === 0">
  No articles are here... yet.
</div>

<nav [hidden]="!loading && list.length === 0">
  <ul class="pagination">
    <li class="page-item"
        [class.active]="pageNumber === listConfig.currentPage"
        *ngFor="let pageNumber of [].constructor(listConfig.totalPages); let i = index">
      <a class="page-link"
         (click)="setPageTo(i + 1)">
        {{ i + 1 }}
      </a>
    </li>
  </ul>
</nav>
