<!-- Angular 12 version of comment.html -->
<div class="card">
  <div class="card-block">
    <!-- Replaced ng-bind with interpolation and removed one-time binding syntax -->
    <p class="card-text">{{ data.body }}</p>
  </div>
  <div class="card-footer">
    <!-- Replaced ui-sref with routerLink and $ctrl.data with data -->
    <a class="comment-author" [routerLink]="['/profile', data.author.username]">
      <!-- Replaced ng-src with standard [src] binding -->
      <img [src]="data.author.image" class="comment-author-img" />
    </a>
    &nbsp;
    <!-- Updated routerLink and binding syntax -->
    <a class="comment-author" [routerLink]="['/profile', data.author.username]">
      {{ data.author.username }}
    </a>
    <span class="date-posted">
      <!-- Replaced ng-bind with interpolation and pipe syntax remains similar -->
      {{ data.createdAt | date: 'longDate' }}
    </span>
    <!-- Replaced ng-show with *ngIf -->
    <span class="mod-options" *ngIf="canModify">
      <!-- Replaced ng-click with (click) -->
      <i class="ion-trash-a" (click)="deleteCb()"></i>
    </span>
  </div>
</div>
