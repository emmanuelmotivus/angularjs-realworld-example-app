<!-- Angular 12 footer component template -->
<footer>
  <div class="container">
    <!-- Changed ui-sref to routerLink for Angular routing -->
    <a class="logo-font" [routerLink]="['/']" [innerHTML]="appName | lowercase"></a>
    <span class="attribution">
      <!-- Removed one-time binding syntax (::) and kept the date pipe -->
      &copy; {{date | date:'yyyy'}}.
      An interactive learning project from <a href="https://thinkster.io">Thinkster</a>.
      Code licensed under MIT.
    </span>
  </div>
</footer>
