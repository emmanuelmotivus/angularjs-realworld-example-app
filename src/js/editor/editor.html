<!-- editor.html - Upgraded from Angular 1.x to Angular 12 -->
<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">

        <!-- Changed from list-errors to app-list-errors and updated input binding -->
        <app-list-errors [errors]="errors"></app-list-errors>

        <!-- Added [formGroup] to connect with the reactive form -->
        <form [formGroup]="articleForm">
          <!-- Changed ng-disabled to [disabled] -->
          <fieldset [disabled]="isSubmitting">

            <fieldset class="form-group">
              <!-- Changed ng-model to formControlName -->
              <input class="form-control form-control-lg"
                formControlName="title"
                type="text"
                placeholder="Article Title" />
            </fieldset>

            <fieldset class="form-group">
              <!-- Changed ng-model to formControlName -->
              <input class="form-control"
                formControlName="description"
                type="text"
                placeholder="What's this article about?" />
            </fieldset>

            <fieldset class="form-group">
              <!-- Changed ng-model to formControlName -->
              <textarea class="form-control"
                rows="8"
                formControlName="body"
                placeholder="Write your article (in markdown)">
              </textarea>
            </fieldset>

            <fieldset class="form-group">
              <!-- Changed ng-model to [(ngModel)] and added name attribute -->
              <!-- Changed ng-keyup to (keyup.enter) -->
              <input class="form-control"
                type="text"
                placeholder="Enter tags"
                [(ngModel)]="tagField"
                [ngModelOptions]="{standalone: true}"
                (keyup.enter)="addTag()" />

              <div class="tag-list">
                <!--
