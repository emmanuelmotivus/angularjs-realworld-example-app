<!-- 
  Angular 12 template for favorite button component
  Changes made:
  - Replaced ng-class with [ngClass]
  - Replaced ng-click with (click)
  - Replaced $ctrl references with direct property references
  - Replaced ng-transclude with <ng-content>
-->
<button class="btn btn-sm"
  [ngClass]="{ 'disabled': isSubmitting,
              'btn-outline-primary': !article.favorited,
              'btn-primary': article.favorited }"
  (click)="submit()">
  <i class="ion-heart"></i> <ng-content></ng-content>
</button>
