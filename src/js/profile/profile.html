<div class="profile-page">

  <!-- User's basic info & action buttons -->
  <div class="user-info">
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-md-10 offset-md-1">

          <!-- Changed ng-src to [src] for Angular binding -->
          <img [src]="profile.image" class="user-img" />
          <!-- Changed ng-bind to interpolation syntax -->
          <h4>{{profile.username}}</h4>
          <p>{{profile.bio}}</p>

          <!-- Changed ui-sref to routerLink and ng-show to *ngIf -->
          <a [routerLink]="['/settings']"
            class="btn btn-sm btn-outline-secondary action-btn"
            *ngIf="isUser">
            <i class="ion-gear-a"></i> Edit Profile Settings
          </a>

          <!-- Changed $ctrl reference to direct property reference -->
          <follow-btn [user]="profile" *ngIf="!isUser"></follow-btn>

        </div>
      </div>
    </div>
  </div>

  <!-- Container where User's posts & favs are list w/ toggle tabs -->
  <div class="container">
    <div class="row">

      <div class="col-xs-12 col-md-10 offset-md-1">

        <!-- Tabs for switching between author articles & favorites -->
        <div class="articles-toggle">
          <ul class="nav nav-pills outline-active">

            <li class="nav-item">
              <!-- Changed ui-sref and ui-sref-active to routerLink and routerLinkActive -->
              <a class="nav-link active"
                routerLinkActive="active"
                [routerLink]="['/profile', profile.username]">
                My Articles
              </a>
            </li>

            <li class="nav-item">
              <!-- Changed ui-sref and ui-sref-active to routerLink and routerLinkActive -->
              <a class="nav-link"
                routerLinkActive="active"
                [routerLink]="['/profile', profile.username, 'favorites']">
                Favorited Articles
              </a>
            </li>

          </ul>
        </div>

        <!-- Changed ui-view to router-outlet -->
        <router-outlet></router-outlet>


      </div>

    <!-- End row & container divs -->
    </div>
  </div>

</div>
